name: New Workflow 2
on:
  - push
jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
          with:
            node-version: ${{ matrix.node-version }}
            cache: pnpm

      - run: make setup
      - run: make test
      - uses: hexlet-components/hello-from-hexlet-action@release