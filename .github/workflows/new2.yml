name: New Workflow 2
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: pnmp install --legacy-peer-deps
      - run: NODE_OPTIONS="--max-old-space-size=4096 --no-warnings" pnmp test
      - uses: hexlet-components/hello-from-hexlet-action@release